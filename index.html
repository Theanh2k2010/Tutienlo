<style>
:root{--gold:#f4cf78;--violet:#302044;--line:#9877b8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d19;color:#f8efd9;font:14px system-ui, sans-serif;touch-action:none}button{font:inherit;color:inherit;cursor:pointer}#app{height:100dvh;width:min(100%,760px);margin:auto;display:flex;flex-direction:column;background:#151222;position:relative;overflow:hidden;border-inline:1px solid #49375d}header{display:flex;gap:7px;align-items:center;padding:7px;background:linear-gradient(#392750,#1c152b);border-bottom:2px solid var(--gold);z-index:2}.portrait{width:53px;height:55px;border:2px solid var(--gold);border-radius:8px;background:#54416c;display:grid;place-items:center;font-size:29px;flex:none}.stats{flex:1;min-width:0;font-size:10px}.topline,.statline{display:flex;justify-content:space-between;gap:5px}.topline{font-size:12px;font-weight:900;color:#ffe49a}.statline{margin-top:2px}.bar{height:7px;background:#0b0912;border:1px solid #635276;border-radius:8px;overflow:hidden;margin:2px 0}.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#b92549,#ff8790)}.qi{background:linear-gradient(90deg,#167caa,#65e5ee)}.xp{background:linear-gradient(90deg,#7738bd,#e2b5ff)}.headbtn{height:55px;min-width:47px;padding:3px;border:1px solid #9c7cba;border-radius:8px;background:linear-gradient(#493263,#21162f);font-size:10px;font-weight:800}#stage{flex:1;min-height:0;position:relative;background:#1d3d30}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#loc{position:absolute;top:7px;left:8px;text-shadow:1px 2px #000;font-weight:800;font-size:12px;pointer-events:none}#mini{position:absolute;right:8px;top:8px;width:100px;height:100px;border:2px solid #b28cc9;border-radius:9px;background:#171126e8;padding:3px}#minimap{width:100%;height:100%}#quest{position:absolute;top:8px;left:8px;right:116px;display:block;background:#241936ed;border:2px solid #a58ac0;border-radius:9px;padding:7px 9px;box-shadow:0 3px #09070e;font-size:11px}#quest b{color:var(--gold)}#quest:active{transform:translateY(1px)}#quest button{float:right;background:#b77b32;color:#241329;border:1px solid #ffe19a;border-radius:6px;padding:5px 8px;font-weight:900;font-size:10px}#hint{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);background:#160f25d9;border:1px solid #9273b1;border-radius:20px;padding:5px 10px;font-size:10px;white-space:nowrap;pointer-events:none}#toast{position:absolute;z-index:5;top:43%;left:50%;transform:translate(-50%,-50%);display:none;max-width:88%;text-align:center;padding:10px 15px;border:2px solid #74d9e9;border-radius:10px;background:#19152bf2;font-weight:900;box-shadow:0 0 22px #0009}#bottom{padding:6px 7px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(#291c3b,#120e1c);border-top:2px solid #9674b3;z-index:2}.toolbar,.nav{display:flex;gap:5px}.toolbar button,.nav button,.action,.pad button{background:linear-gradient(#493263,#21152f);border:1px solid #987ab7;border-radius:7px;box-shadow:inset 0 1px #c5acd7,0 2px #08060c;font-weight:800}.toolbar button{flex:1;padding:7px 2px;font-size:10px}.controlrow{display:flex;align-items:center;gap:7px;margin:6px 0}.pad{display:grid;grid-template-columns:repeat(3,37px);grid-template-rows:repeat(3,31px);gap:2px;flex:1}.pad button{font-size:16px}.empty{visibility:hidden}.actions{display:flex;gap:4px}.action{height:69px;width:52px;font-size:10px}.action.hit{width:74px;background:linear-gradient(#a85d30,#572a20);border:2px solid #f5ce77;font-size:14px}.nav button{flex:1;padding:7px 1px;font-size:9px}.modal{position:absolute;inset:0;z-index:10;background:#080711d9;display:none;place-items:center;padding:12px}.panel{width:min(100%,460px);max-height:88%;overflow:auto;padding:14px;background:linear-gradient(145deg,#3a2854,#171123);border:2px solid #d0ad69;border-radius:13px;box-shadow:0 0 0 3px #48345f}.panel h2{text-align:center;color:#ffe29a;margin:0 0 10px;font-size:19px}.panel p{font-size:12px;line-height:1.5;color:#e2d6ed}.panel button{background:#493263;border:1px solid #aa8bc8;border-radius:7px;padding:8px 10px;margin:3px;font-weight:800}.panel .primary{background:linear-gradient(#c18a42,#805020);border-color:#ffe09a;color:#201326}.panel .close{float:right}.card{background:#21172f;border:1px solid #8266a3;border-radius:8px;padding:10px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #49365d;padding:7px;font-size:12px}.muted{color:#bdaecc;font-size:11px}.panel input{width:100%;padding:10px;border-radius:7px;background:#100c19;color:white;border:1px solid #967bb3}.barline{height:7px;background:#100c19;border-radius:9px;overflow:hidden}.barline i{display:block;height:100%;background:#72d6a7}@media(max-height:680px){header{padding:4px}.portrait,.headbtn{height:46px}.portrait{width:46px}.toolbar button{padding:4px 1px}.pad{grid-template-columns:repeat(3,31px);grid-template-rows:repeat(3,27px)}.action{height:59px}.nav button{padding:5px 1px}#mini{width:78px;height:78px}#quest{top:91px}}

</head><body><div id="app">
<header><div class="portrait" id="portrait">🧙</div><div class="stats"><div class="topline"><span id="pname">Đạo hữu</span><span id="realm">Luyện Khí 1</span></div><div class="statline"><span>HP</span><span id="hpv">120/120</span></div><div class="bar"><div id="hpbar" class="fill hp"></div></div><div class="statline"><span>LINH KHÍ</span><span id="qiv">100/100</span></div><div class="bar"><div id="qibar" class="fill qi"></div></div><div class="statline"><span>EXP</span><span id="expv">0/80</span></div><div class="bar"><div id="expbar" class="fill xp" style="width:0%"></div></div></div><button class="headbtn" onclick="panel('map')">🗺️<br>Bản đồ</button><button class="headbtn" onclick="panel('menu')">☰<br>Menu</button></header>
<div id="stage"><canvas id="world"></canvas><div id="loc">Thôn Thanh Trúc · Ban ngày · V6</div><div id="mini"><canvas id="minimap" width="120" height="120"></canvas></div><div id="quest"><button id="questbtn" onclick="panel('quests')">Nhận nhiệm vụ</button><b>📜 <span id="qtitle">Nhiệm vụ tân thủ</span></b><div id="qdesc">Đến gặp Trưởng thôn</div></div><div id="toast"></div><div id="hint">Dùng nút di chuyển · Chạm quái để chọn · ⚔ để đánh</div></div>
<div id="bottom"><div class="toolbar"><button onclick="panel('quests')">📜 Nhiệm vụ</button><button onclick="panel('inventory')">🎒 Túi đồ</button><button onclick="meditate()">☯ Tu luyện</button><button onclick="panel('shop')">🪙 Thương hội</button></div><div class="controlrow"><div class="pad"><button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button><button data-dir="left">◀</button><button onclick="interact()">✦</button><button data-dir="right">▶</button><button class="empty"></button><button data-dir="down">▼</button><button class="empty"></button></div><div class="actions"><button class="action" onclick="toggleAuto()">AUTO<br><span id="autotxt">Tắt</span></button><button class="action" onclick="skill()">✦<br>Kỹ năng</button><button class="action hit" onclick="attack()">⚔<br>ĐÁNH</button></div></div><div class="nav"><button onclick="panel('areas')">🌲 Khu vực</button><button onclick="panel('skills')">✧ Công pháp</button><button onclick="panel('achievements')">🏆 Thành tựu</button><button onclick="save();toast('Đã lưu tiến trình')">💾 Lưu</button></div></div>
<div class="modal" id="modal"><div class="panel" id="panelbox"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('world'),cx=cv.getContext('2d'),mc=$('minimap').getContext('2d');cx.imageSmoothingEnabled=false;
const W=1800,H=1400,T=32,saveKey='tienlo_pixel_complete_v4';
let vw=1,vh=1,dpr=1,cam={x:0,y:0},last=0,elapsed=0,toastTimer=0,auto=false,started=false,held={},selected=null,fx=[],mobs=[],drops=[],npcs=[],obstacles=[],decor=[],quest={state:0,kills:0,step:0},area=0;
const P={name:'Đạo hữu',cls:'Kiếm tu',x:900,y:700,hp:140,maxhp:140,qi:100,maxqi:100,exp:0,level:1,realm:1,atk:18,coins:65,herbs:2,potions:2,dir:1,walk:0,attackCd:0,skillCd:0,invuln:0};
const rand=(a,b)=>Math.random()*(b-a)+a,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=$('stage').getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);vw=Math.max(1,r.width);vh=Math.max(1,r.height);cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);cx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function makeWorld(){obstacles=[];decor=[];npcs=[{x:875,y:570,name:'Trưởng thôn',kind:'elder',color:'#d6c7a1',talk:'Thiếu hiệp, yêu thú xuất hiện ở rừng phía đông. Hãy giúp thôn trừ họa.'},{x:1030,y:690,name:'Đan sư',kind:'alchemist',color:'#65b9a1',talk:'Ta có thể chế tác đan dược từ linh thảo.'},{x:720,y:820,name:'Thủ vệ',kind:'guard',color:'#c66b55',talk:'Phía bắc có hang sói, hãy chuẩn bị trước khi vào.'}];
for(let i=0;i<115;i++){let x=rand(45,W-45),y=rand(45,H-45);if(Math.hypot(x-900,y-700)<190)continue;decor.push({x,y,type:Math.random()<.52?'tree':Math.random()<.5?'rock':'flower',v:Math.floor(rand(0,4))})}
for(let i=0;i<35;i++){let x=rand(100,W-100),y=rand(100,H-100);if(Math.hypot(x-900,y-700)<210)continue;obstacles.push({x,y,r:22})}
spawnMobs()}
function spawnMobs(){mobs=[];const types=[['Mộc linh','#58b96e',28,7,24],['Linh thỏ','#d7c4dc',22,5,20],['Sói xám','#858b9b',55,11,29],['Yêu hoa','#d66d99',42,9,25],['Thạch quỷ','#9d8b76',90,14,32]];
for(let i=0;i<26;i++){let t=types[i%5],x=rand(180,W-180),y=rand(180,H-180);if(Math.hypot(x-900,y-700)<240){x=rand(1200,1650);y=rand(300,1150)}mobs.push({x,y,homeX:x,homeY:y,name:t[0],color:t[1],hp:t[2],maxhp:t[2],atk:t[3],r:t[4],speed:.35+(i%3)*.12,cd:rand(0,60),alive:true,phase:rand(0,6),type:i%5})}}
makeWorld();
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1700)}
function hud(){ $('pname').textContent=P.name+' · '+P.cls;$('realm').textContent='Luyện Khí '+P.level;$('hpv').textContent=Math.ceil(P.hp)+'/'+P.maxhp;$('qiv').textContent=Math.ceil(P.qi)+'/'+P.maxqi;$('expv').textContent=P.exp+'/'+needExp();$('hpbar').style.width=100*P.hp/P.maxhp+'%';$('qibar').style.width=100*P.qi/P.maxqi+'%';$('expbar').style.width=100*P.exp/needExp()+'%';$('quest').style.display='block';$('questbtn').textContent=quest.state===0?'Mở nhiệm vụ':quest.state===2?'Nhận thưởng':'Chi tiết';$('qtitle').textContent=quest.state>=3?'Sói dữ trong hang':'Thử thách tân thủ';$('qdesc').textContent=quest.state===0?'Nhấn để xem và nhận nhiệm vụ':quest.state===1?'Tiêu diệt Mộc linh: '+quest.kills+'/3':quest.state===2?'Đã hoàn thành · Chạm nhận thưởng':quest.state===3?'Nhiệm vụ Sói xám đã mở':quest.state===4?'Hạ Sói xám: '+quest.kills+'/2':'Chuỗi nhiệm vụ tân thủ hoàn thành'}
function needExp(){return 80+(P.level-1)*45}
function gainExp(n){P.exp+=n;while(P.exp>=needExp()){P.exp-=needExp();P.level++;P.maxhp+=16;P.maxqi+=8;P.atk+=3;P.hp=P.maxhp;P.qi=P.maxqi;toast('Đột phá! Luyện Khí '+P.level+' · Sức mạnh tăng!')}hud()}
function save(){try{localStorage.setItem(saveKey,JSON.stringify({P,quest,area}))}catch(e){toast('Trình duyệt không cho phép lưu dữ liệu')}}
function load(){try{let s=JSON.parse(localStorage.getItem(saveKey)||'null');if(s&&s.P){Object.assign(P,s.P);quest=Object.assign(quest,s.quest||{});area=s.area||0;started=true;hud();$('loc').textContent=['Thôn Thanh Trúc','Rừng Linh','Hang Sói'][area]+' · Ban ngày';return true}}catch(e){}return false}
function startGame(){if(started)return;P.name=($('name').value.trim()||'Đạo hữu').slice(0,14);P.cls=window.chosen||'Kiếm tu';started=true;$('modal').style.display='none';hud();toast('Hành trình bắt đầu! Hãy gặp Trưởng thôn.');save()}
function pixel(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawTree(x,y,v){let leaf=['#286348','#347653','#4a8050','#426b55'][v];pixel(x-5,y+13,10,18,'#60432e');pixel(x-16,y+2,32,17,'#1a4938');pixel(x-13,y-5,26,18,leaf);pixel(x-8,y-10,17,13,['#5c9b5b','#8d9d48','#bd754d','#648c76'][v]);pixel(x-7,y-6,5,4,'#a7c66b');pixel(x+4,y,4,4,'#d2b66b')}
function drawPerson(x,y,kind,color,frame=0){
 let bob=(frame%4===0?0:frame%4===1?1:frame%4===2?0:-1), walk=(frame%4===1||frame%4===3)?2:0;
 const player=kind==='player', elder=kind==='elder', guard=kind==='guard', alchemist=kind==='alchemist';
 const robe=player?(window.chosen==='Đan tu'?'#4e9274':window.chosen==='Độc tu'?'#5c668b':window.chosen==='Phù tu'?'#9b6bb0':'#426eac'):color;
 // cast shadow and robe silhouette
 pixel(x-10,y+13,20,6,'#101b18');pixel(x-8,y+3+bob,16,14,robe);pixel(x-11,y+5+bob,5,10,robe);pixel(x+6,y+5+bob,5,10,robe);
 pixel(x-7,y+7+bob,14,8,player?'#365b91':elder?'#b6a890':guard?'#75452e':'#39785f');
 pixel(x-4,y+4+bob,8,12,player?'#7da6d8':elder?'#e0d8c5':guard?'#ad714c':'#81d0ae');
 // sleeves and hands
 pixel(x-12,y+4+bob,5,8,robe);pixel(x+7,y+4+bob,5,8,robe);pixel(x-12,y+11+bob,4,3,'#e8bd92');pixel(x+8,y+11+bob,4,3,'#e8bd92');
 // legs animate subtly
 pixel(x-7,y+16+walk/2,5,5,'#302538');pixel(x+2,y+16-walk/2,5,5,'#302538');pixel(x-8,y+20+walk/2,6,2,'#ba9d72');pixel(x+2,y+20-walk/2,6,2,'#ba9d72');
 // face, ears, hair
 pixel(x-7,y-5+bob,14,10,'#edc69f');pixel(x-9,y-3+bob,3,4,'#d5a17f');pixel(x+6,y-3+bob,3,4,'#d5a17f');pixel(x-5,y-2+bob,2,2,'#2a2430');pixel(x+3,y-2+bob,2,2,'#2a2430');pixel(x-3,y+2+bob,6,1,'#9b6658');
 let hair=player?'#e8e9f4':elder?'#dedbd2':guard?'#372821':'#382c24';pixel(x-9,y-9+bob,18,6,hair);pixel(x-8,y-7+bob,5,5,hair);pixel(x+3,y-7+bob,7,5,hair);pixel(x-6,y-10+bob,11,3,hair);
 // hair bun / hat accents
 if(elder){pixel(x-4,y-13+bob,8,5,'#b8ad99');pixel(x-2,y-14+bob,4,2,'#e4d6b5')}
 if(guard){pixel(x-9,y-12+bob,18,5,'#6b4731');pixel(x-4,y-14+bob,8,3,'#c28b55')}
 if(alchemist){pixel(x-9,y-11+bob,18,4,'#347d65');pixel(x-3,y-12+bob,6,3,'#d4e7bd')}
 if(player){pixel(x-11,y+2+bob,3,7,'#d5b866');pixel(x+8,y+2+bob,3,7,'#d5b866');pixel(x-4,y+12+bob,8,2,'#d5b866')}
}
function drawMob(m){let x=m.x,y=m.y+Math.sin(elapsed/150+m.phase)*2, blink=Math.sin(elapsed/260+m.phase)>-.88;pixel(x-m.r*.65,y+m.r*.55,m.r*1.3,5,'#14251e');if(m.type===0){pixel(x-13,y-12,26,24,'#347e50');pixel(x-9,y-18,18,10,'#64c77a');pixel(x-7,y-4,4,4,'#fff');pixel(x+4,y-4,4,4,'#fff');pixel(x-6,y-3,2,3,'#18251d');pixel(x+5,y-3,2,3,'#18251d')}else if(m.type===1){pixel(x-10,y-9,20,17,'#e4d5e7');pixel(x-9,y-20,7,15,'#c5a9d1');pixel(x+3,y-20,7,15,'#c5a9d1');pixel(x-12,y+1,5,4,'#b49abf');pixel(x+7,y+1,5,4,'#b49abf');pixel(x-5,y-3,3,3,'#34283b');pixel(x+3,y-3,3,3,'#34283b')}else if(m.type===2){pixel(x-16,y-8,32,19,'#626b7d');pixel(x-16,y+1,5,6,'#4e5869');pixel(x+11,y+1,5,6,'#4e5869');pixel(x-10,y-16,20,12,'#858fa1');pixel(x-10,y-20,6,8,'#b7b9c0');pixel(x+5,y-20,6,8,'#b7b9c0');pixel(x-8,y-2,4,3,'#ffcf72');pixel(x+5,y-2,4,3,'#ffcf72')}else if(m.type===3){pixel(x-12,y-8,24,21,'#a94e7b');pixel(x-18,y-18,12,12,'#e17caa');pixel(x+7,y-18,12,12,'#e17caa');pixel(x-4,y-18,8,7,'#ffd4a2');pixel(x-8,y+5,16,4,'#713654');pixel(x-6,y-2,4,4,'#fff0a1');pixel(x+4,y-2,4,4,'#fff0a1')}else{pixel(x-17,y-12,34,28,'#756a61');pixel(x-12,y-19,24,11,'#a69a84');pixel(x-10,y-4,5,4,'#ff9e55');pixel(x+5,y-4,5,4,'#ff9e55')}
if(m.hp<m.maxhp){pixel(x-18,y-m.r-12,36,4,'#21151b');pixel(x-18,y-m.r-12,36*m.hp/m.maxhp,4,'#e75c67')} }
function drawWorld(){cx.fillStyle='#254b39';cx.fillRect(0,0,vw,vh);cx.save();cx.translate(-cam.x,-cam.y);
for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){let n=((x/T*13+y/T*7)%11);pixel(x,y,T,T,n<2?'#2a523d':n<5?'#28503a':'#2b543e');if(n===3){pixel(x+8,y+9,2,2,'#71945a');pixel(x+22,y+23,2,2,'#416b48')}}
/* village paths and plaza */pixel(760,560,290,42,'#82674b');pixel(875,420,45,430,'#806348');pixel(770,650,270,180,'#777b78');pixel(780,660,250,160,'#999d96');for(let i=0;i<18;i++){let x=790+(i%6)*42,y=672+Math.floor(i/6)*43;pixel(x,y,30,28,'#858b89');pixel(x+3,y+3,3,3,'#b8bcb2')}
decor.forEach(d=>{if(d.type==='tree')drawTree(d.x,d.y,d.v);else if(d.type==='rock'){pixel(d.x-12,d.y-5,24,15,'#53665e');pixel(d.x-7,d.y-12,15,10,'#78877a');pixel(d.x-5,d.y-10,5,3,'#a5a99a')}else{pixel(d.x-5,d.y,4,4,'#e4a3b7');pixel(d.x+2,d.y-3,4,4,'#e8d68a');pixel(d.x,d.y+4,4,4,'#8bb9d1');pixel(d.x-7,d.y+4,3,3,'#e7c4ec');pixel(d.x+5,d.y+6,3,3,'#f3a5b4')}});
/* NPC and mobs */npcs.forEach(n=>{drawPerson(n.x,n.y,n.kind,n.color,Math.floor(elapsed/350));cx.fillStyle='#fff0c9';cx.font='bold 11px system-ui';cx.textAlign='center';cx.fillText(n.name,n.x,n.y-25)});
mobs.forEach(m=>{if(m.alive)drawMob(m)});
drops.forEach(d=>{pixel(d.x-4,d.y-4,8,8,'#f6d36e');pixel(d.x-2,d.y-2,4,4,'#fff2b2')});
/* player aura and sprite */cx.globalAlpha=.25;cx.fillStyle='#7de3e7';cx.beginPath();cx.ellipse(P.x,P.y+10,22,9,0,0,Math.PI*2);cx.fill();cx.globalAlpha=1;drawPerson(P.x,P.y,'player','#477eb4',Math.floor(P.walk/8));pixel(P.x-8,P.y-15,16,5,'#e8e5f4');pixel(P.x-5,P.y-20,10,7,'#f6f1ff');pixel(P.x-4,P.y-6,3,3,'#302638');pixel(P.x+3,P.y-6,3,3,'#302638');
if(selected&&selected.alive){cx.strokeStyle='#ffe17d';cx.lineWidth=2;cx.beginPath();cx.ellipse(selected.x,selected.y+3,selected.r+9,selected.r*.65,0,0,Math.PI*2);cx.stroke()}
fx=fx.filter(f=>elapsed-f.t<450);fx.forEach(f=>{let a=1-(elapsed-f.t)/450;cx.globalAlpha=a;cx.strokeStyle=f.color;cx.lineWidth=3;cx.beginPath();cx.arc(f.x,f.y,12+(1-a)*35,0,Math.PI*2);cx.stroke();cx.globalAlpha=1});
cx.restore()}
function minimap(){mc.fillStyle='#1d422f';mc.fillRect(0,0,120,120);mc.fillStyle='#84694d';mc.fillRect(46,0,8,120);mc.fillRect(0,50,120,8);npcs.forEach(n=>{mc.fillStyle='#e8d18a';mc.fillRect(n.x/W*120-2,n.y/H*120-2,4,4)});mobs.forEach(m=>{if(m.alive){mc.fillStyle='#e46b69';mc.fillRect(m.x/W*120-1,m.y/H*120-1,3,3)}});mc.fillStyle='#72e5f0';mc.fillRect(P.x/W*120-3,P.y/H*120-3,6,6)}
function frame(t){let dt=Math.min(32,t-last||16);last=t;elapsed+=dt;update(dt);cam.x=clamp(P.x-vw/2,0,W-vw);cam.y=clamp(P.y-vh/2,0,H-vh);drawWorld();minimap();requestAnimationFrame(frame)}
function move(dx,dy){let l=Math.hypot(dx,dy)||1;dx=dx/l*2.8;dy=dy/l*2.8;let nx=clamp(P.x+dx,20,W-20),ny=clamp(P.y+dy,20,H-20);if(!obstacles.some(o=>Math.hypot(nx-o.x,ny-o.y)<o.r+10)){P.x=nx;P.y=ny;P.walk++;if(dx)P.dir=Math.sign(dx)}}
function update(dt){if(!started)return;let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);if(dx||dy)move(dx,dy);mobs.forEach(m=>{if(!m.alive)return;let d=dist(P,m);if(d<190){if(d>m.r+16){m.x+=(P.x-m.x)/Math.max(1,d)*m.speed*dt/16;m.y+=(P.y-m.y)/Math.max(1,d)*m.speed*dt/16}else if(m.cd<=0){m.cd=105;hurt(m.atk)}}else{m.x+=(m.homeX-m.x)*.002;m.y+=(m.homeY-m.y)*.002}m.cd=Math.max(0,m.cd-dt/16)});if(auto){if(!selected||!selected.alive)selected=mobs.filter(m=>m.alive).sort((a,b)=>dist(P,a)-dist(P,b))[0]||null;if(selected){let d=dist(P,selected);if(d>48)move(selected.x-P.x,selected.y-P.y);else if(P.attackCd<=0)attack()}}P.attackCd=Math.max(0,P.attackCd-dt/16);P.skillCd=Math.max(0,P.skillCd-dt/16);P.invuln=Math.max(0,P.invuln-dt/16);if(Math.floor(elapsed/5000)!==Math.floor((elapsed-dt)/5000)){P.qi=Math.min(P.maxqi,P.qi+4);hud()} }
function hurt(n){if(P.invuln>0)return;P.hp=Math.max(0,P.hp-n);P.invuln=35;fx.push({x:P.x,y:P.y,t:elapsed,color:'#ff6479'});hud();if(P.hp<=0){P.hp=P.maxhp;P.x=900;P.y=700;P.coins=Math.max(0,P.coins-5);toast('Trọng thương! Được đưa về thôn, mất 5 linh thạch.');save()}}
function nearest(){return mobs.filter(m=>m.alive&&dist(P,m)<75).sort((a,b)=>dist(P,a)-dist(P,b))[0]}
function attack(){if(!started)return;if(P.attackCd>0)return;let m=selected&&selected.alive&&dist(P,selected)<100?selected:nearest();if(!m){toast('Hãy đến gần và chọn một yêu thú');return}selected=m;P.attackCd=24;let dmg=P.atk+Math.floor(rand(-3,5));m.hp-=dmg;fx.push({x:m.x,y:m.y,t:elapsed,color:'#fff0a1'});toast('Kiếm khí · '+dmg+' sát thương');if(m.hp<=0){m.alive=false;P.coins+=Math.floor(rand(3,9));gainExp(m.type===4?32:16);drops.push({x:m.x,y:m.y});if((quest.state===1&&m.type===0)||(quest.state===4&&m.type===2)){quest.kills++;if(quest.kills>=(quest.state===1?3:2))quest.state=2;hud()}save()}hud()}
function skill(){if(!started)return;if(P.skillCd>0)return toast('Kỹ năng đang hồi');if(P.qi<25)return toast('Không đủ linh khí');P.qi-=25;P.skillCd=90;let hit=mobs.filter(m=>m.alive&&dist(P,m)<125);hit.forEach(m=>{m.hp-=P.atk*2;fx.push({x:m.x,y:m.y,t:elapsed,color:'#79e9f3'});if(m.hp<=0){m.alive=false;P.coins+=6;gainExp(18)}});hud();toast('✦ Kiếm khí bùng nổ · '+hit.length+' mục tiêu trúng đòn');save()}
function meditate(){if(!started)return;P.hp=Math.min(P.maxhp,P.hp+24);P.qi=Math.min(P.maxqi,P.qi+35);gainExp(4);toast('Tĩnh tâm vận khí: hồi phục và +4 EXP');save()}
function interact(){if(!started)return;let n=npcs.slice().sort((a,b)=>dist(P,a)-dist(P,b))[0];if(n&&dist(P,n)<90){panel('dialog',n);return}let d=drops.find(d=>dist(P,d)<65);if(d){drops.splice(drops.indexOf(d),1);P.herbs++;P.coins+=2;toast('Nhặt linh thảo và 2 linh thạch');save();return}toast('Đến gần NPC hoặc vật phẩm để tương tác')}
function toggleAuto(){auto=!auto;$('autotxt').textContent=auto?'Bật':'Tắt';toast(auto?'Tự động chiến đấu bật':'Đã tắt auto')}
function accept(){if(quest.state===0){quest.state=1;quest.kills=0;toast('Đã nhận: Tiêu diệt 3 Mộc linh!')}else if(quest.state===2){P.coins+=35;P.herbs+=2;gainExp(70);quest.state=quest.step?5:3;quest.step=1;quest.kills=0;toast('Nhận thưởng: 35 linh thạch, 2 linh thảo, 70 EXP')}else if(quest.state===3){quest.state=4;quest.kills=0;toast('Nhiệm vụ mới: Hạ 2 Sói xám!')}hud();panel('quests');save()}
function panel(type,arg){let b=$('panelbox'),html='<button class="close" onclick="closePanel()">Đóng ✕</button>';if(type==='create'){html+='<h2>☯ TIÊN LỘ PIXEL</h2><p>Chọn đạo tu, đặt đạo hiệu và bước vào con đường trường sinh.</p><div class="card"><p>Đạo tu</p><button onclick="chooseClass(\'Kiếm tu\')">⚔ Kiếm tu</button><button onclick="chooseClass(\'Đan tu\')">⚗ Đan tu</button><button onclick="chooseClass(\'Độc tu\')">☘ Độc tu</button><button onclick="chooseClass(\'Phù tu\')">符 Phù tu</button><p>Đạo hiệu</p><input id="name" maxlength="14" value="Theanh2k"></div><button class="primary" style="width:100%" onclick="startGame()">Bắt đầu hành trình</button><p class="muted">Toàn bộ nhân vật, quái, cây, hiệu ứng và bản đồ được vẽ bằng Canvas trong file này. Không ảnh mạng, không thư viện ngoài.</p>'}
else if(type==='quests'){html+='<h2>📜 Bảng nhiệm vụ</h2>';if(quest.state===0)html+='<div class="card"><b>Thử thách tân thủ</b><p>Gặp Trưởng thôn để nhận nhiệm vụ diệt yêu thú.</p><button class="primary" onclick="closePanel();interact()">Đến gặp Trưởng thôn</button><button class="primary" onclick="quest.state=1;hud();panel(\'quests\');save()">NHẬN NHIỆM VỤ</button></div>';else if(quest.state===1)html+='<div class="card"><b>Tiêu diệt 3 Mộc linh</b><p>Tiến độ: '+quest.kills+'/3</p><div class="barline"><i style="width:'+quest.kills/3*100+'%"></i></div><p>Thưởng: 70 EXP · 35 linh thạch · 2 linh thảo</p></div>';else if(quest.state===2)html+='<div class="card"><b>✓ Đã hoàn thành</b><p>Phần thưởng đã sẵn sàng.</p><button class="primary" onclick="accept()">NHẬN THƯỞNG</button></div>';else if(quest.state===3)html+='<div class="card"><b>Hang Sói thức tỉnh</b><p>Trưởng thôn cần bạn hạ 2 Sói xám.</p><button class="primary" onclick="accept()">NHẬN NHIỆM VỤ</button></div>';else if(quest.state===4)html+='<div class="card"><b>Hạ 2 Sói xám</b><p>Tiến độ: '+quest.kills+'/2</p><div class="barline"><i style="width:'+quest.kills/2*100+'%"></i></div><p>Thưởng: 100 EXP · 60 linh thạch</p></div>';else html+='<div class="card"><b>✓ Chuỗi nhiệm vụ tân thủ hoàn thành</b><p>Thôn Thanh Trúc đã bình yên. Hãy tiếp tục khám phá Rừng Linh và Hang Sói.</p><p>Đã hoàn thành: Mộc linh và Sói xám.</p></div>'}
else if(type==='dialog'){html+='<h2>💬 '+arg.name+'</h2><p>'+arg.talk+'</p>';if(arg.kind==='elder')html+='<button class="primary" onclick="closePanel();panel(\'quests\')">Xem / nhận nhiệm vụ</button>';if(arg.kind==='alchemist')html+='<button onclick="brew()">Chế 1 bình hồi phục · 5 linh thạch</button>'}
else if(type==='inventory'){html+='<h2>🎒 Túi đồ</h2><div class="row"><span>💠 Linh thạch</span><b>'+P.coins+'</b></div><div class="row"><span>🌿 Linh thảo</span><b>'+P.herbs+'</b></div><div class="row"><span>🍶 Bình hồi phục</span><b>'+P.potions+'</b></div><button onclick="usePotion()">Dùng bình hồi phục (+60 HP)</button>'}
else if(type==='shop'){html+='<h2>🪙 Thương hội Thanh Trúc</h2><p>Linh thạch: '+P.coins+'</p><div class="card">🍶 Bình hồi phục · 12 linh thạch <button onclick="buy(12,\'potion\')">Mua</button></div><div class="card">🌿 Linh thảo · 8 linh thạch <button onclick="buy(8,\'herb\')">Mua</button></div>'}
else if(type==='areas'){html+='<h2>🌏 Khu vực</h2><div class="card"><b>Thôn Thanh Trúc</b><p>Khu an toàn · Trưởng thôn, Đan sư</p><button onclick="travel(0)">Dịch chuyển miễn phí</button></div><div class="card"><b>Rừng Linh</b><p>Mộc linh, linh thỏ, yêu hoa.</p><button onclick="travel(1)">Dịch chuyển · 10 linh thạch</button></div><div class="card"><b>Hang Sói</b><p>Sói xám, thạch quỷ · nguy hiểm.</p><button onclick="travel(2)">Dịch chuyển · 20 linh thạch</button></div>'}
else if(type==='map'){html+='<h2>🗺 Bản đồ</h2><p>Thôn Thanh Trúc ở trung tâm. Rừng Linh nằm về phía đông, Hang Sói ở phía bắc.</p><p>Chấm xanh: người chơi · Chấm đỏ: yêu thú · Chấm vàng: NPC.</p>'}
else if(type==='skills'){html+='<h2>✧ Công pháp</h2><div class="card"><b>Kiếm khí · 25 linh khí</b><p>Gây sát thương diện rộng quanh nhân vật. Hồi chiêu 90 nhịp.</p><button onclick="closePanel();skill()">Thi triển</button></div><div class="card"><b>Tĩnh tâm</b><p>Hồi HP, linh khí và một ít kinh nghiệm.</p><button onclick="closePanel();meditate()">Tu luyện</button></div>'}
else if(type==='achievements'){html+='<h2>🏆 Thành tựu</h2><div class="row"><span>Đạo hữu nhập thế</span><b>✓</b></div><div class="row"><span>Diệt Mộc linh</span><b>'+Math.min(3,quest.kills)+'/3</b></div><div class="row"><span>Cấp độ hiện tại</span><b>'+P.level+'</b></div><div class="row"><span>Linh thạch tích lũy</span><b>'+P.coins+'</b></div>'}
else{html+='<h2>☰ Menu</h2><button onclick="panel(\'quests\')">Nhiệm vụ</button><button onclick="panel(\'inventory\')">Túi đồ</button><button onclick="save();toast(\'Đã lưu!\')">Lưu game</button><button onclick="if(confirm(\'Xóa dữ liệu chơi?\')){localStorage.removeItem(saveKey);location.reload()}">Chơi mới</button>'}
b.innerHTML=html;$('modal').style.display='grid'}
function closePanel(){$('modal').style.display='none'}
function chooseClass(c){window.chosen=c;toast('Đã chọn '+c)}
function buy(cost,type){if(P.coins<cost)return toast('Không đủ linh thạch');P.coins-=cost;if(type==='potion')P.potions++;else P.herbs++;panel('shop');save()}
function usePotion(){if(!P.potions)return toast('Không còn bình hồi phục');P.potions--;P.hp=Math.min(P.maxhp,P.hp+60);hud();panel('inventory');save()}
function brew(){if(P.coins<5||P.herbs<1)return toast('Cần 5 linh thạch và 1 linh thảo');P.coins-=5;P.herbs--;P.potions++;panel('inventory');save()}
function travel(id){let cost=id===1?10:id===2?20:0;if(P.coins<cost)return toast('Không đủ linh thạch');P.coins-=cost;area=id;P.x=[900,1450,900][id];P.y=[700,1000,250][id];$('loc').textContent=['Thôn Thanh Trúc','Rừng Linh','Hang Sói'][id]+' · Ban ngày';closePanel();toast('Đã đến '+$('loc').textContent);save()}
function pick(e){if(!started)return;let r=cv.getBoundingClientRect(),x=e.clientX-r.left+cam.x,y=e.clientY-r.top+cam.y;let m=mobs.filter(m=>m.alive&&Math.hypot(m.x-x,m.y-y)<65).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(m){selected=m;toast('Mục tiêu: '+m.name+' · '+Math.ceil(m.hp)+' HP');return}let n=npcs.find(n=>Math.hypot(n.x-x,n.y-y)<60);if(n){panel('dialog',n);return}}
cv.addEventListener('pointerdown',pick);
document.querySelectorAll('[data-dir]').forEach(btn=>{let d=btn.dataset.dir;btn.addEventListener('pointerdown',e=>{e.preventDefault();held[d]=true;btn.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>held[d]=false))});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','arrowup'].includes(k))held.up=true;if(['s','arrowdown'].includes(k))held.down=true;if(['a','arrowleft'].includes(k))held.left=true;if(['d','arrowright'].includes(k))held.right=true;if(k===' ')attack();if(k==='e')interact();if(k==='q')skill()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['w','arrowup'].includes(k))held.up=false;if(['s','arrowdown'].includes(k))held.down=false;if(['a','arrowleft'].includes(k))held.left=false;if(['d','arrowright'].includes(k))held.right=false});
if(!load())panel('create');else $('modal').style.display='none';hud();requestAnimationFrame(frame);
Object.assign(window,{panel,closePanel,startGame,chooseClass,attack,skill,meditate,interact,toggleAuto,save,accept,brew,buy,usePotion,travel});

<script>
// V6 extension: equipment upgrades and cultivation breakthroughs, entirely local.

function v6Upgrade(which,costBase){let lv=v6Gear[which]||0,cost=costBase*(lv+1);if(P.coins<cost){toast('Không đủ linh thạch · cần '+cost);return}P.coins-=cost;v6Gear[which]++;if(which==='weapon')P.atk+=4;if(which==='armor'){P.maxhp+=20;P.hp+=20}if(which==='focus'){P.maxqi+=15;P.qi+=15}hud();panel('gear');toast('Luyện khí thành công! '+which+' +1');save()}

// Add accessible buttons into existing navigation without replacing game layout.
let nav=document.querySelector('.nav');if(nav){let g=document.createElement('button');g.textContent='⚒ Trang bị';g.onclick=()=>panel('gear');nav.appendChild(g);let b=document.createElement('button');b.textContent='☯ Đột phá';b.onclick=()=>panel('breakthrough');nav.appendChild(b);let c=document.createElement('button');c.textContent='📖 Sổ tay';c.onclick=()=>panel('codex');nav.appendChild(c)}
